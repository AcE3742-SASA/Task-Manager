# cron-job.org 전환 전까지 유지하는 예약 호출과 수동 복구 경로.
# 전환 확인 후 Variables의 NOTIFY_SCHEDULER를 cron-job.org로 설정한다.
# 이 변경 자체는 기존 예약을 끄지 않는다. docs/cron-job-setup.md 참조.
# 필요한 설정 (레포 Settings → Secrets and variables → Actions):
#   Secrets   → CRON_SECRET  : Vercel 환경변수와 같은 값이어야 한다
#   Variables → NOTIFY_URL   : https://<배포주소>/api/notify
name: notify

on:
  schedule:
    # 매시 정각(UTC). 함수가 KST 로 환산해 판정하므로 UTC 로 둬도 된다.
    # 실행 지연과 누락이 가능하다. 지연의 20분 상한은 없다.
    - cron: '0 * * * *'
  # 새 예약 연결 후에도 수동 실행은 남긴다. 실제 예약 알림을 보낼 수 있다.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fire:
    if: ${{ github.event_name != 'schedule' || vars.NOTIFY_SCHEDULER != 'cron-job.org' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: POST /api/notify
        shell: bash
        env:
          NOTIFY_URL: ${{ vars.NOTIFY_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$NOTIFY_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "NOTIFY_URL variable과 CRON_SECRET secret을 등록해 주세요."
            exit 1
          fi
          case "$NOTIFY_URL" in
            https://*) ;;
            *) echo "NOTIFY_URL은 HTTPS 주소여야 합니다."; exit 1 ;;
          esac
          response="$RUNNER_TEMP/notify-response.json"
          code=$(curl --silent --show-error --max-time 28 \
            --output "$response" --write-out '%{http_code}' --request POST \
            --header "Authorization: Bearer $CRON_SECRET" "$NOTIFY_URL")
          echo "HTTP $code"
          cat "$response"
          echo
          # 200도 기기 수신 완료를 뜻하지 않는다. 실패/대기 건수는 JSON으로 확인한다.
          test "$code" = "200"
