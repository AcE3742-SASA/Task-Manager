<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SASA 할 일</title>
    <!-- appbar 와 같은 paper. 크림으로 두면 상태바 띠와 appbar 사이에 이음매가 보인다.
         다크에서는 settings.ts 가 이 값을 --paper 다크값으로 바꾼다. -->
    <meta name="theme-color" content="#FFFDF8" />

    <!-- CSS/React 이전에 마지막 화면 설정 복원. 로그인 뒤 계정 설정이 우선한다.
         appearance.test.ts가 캐시 검증과 상태바 색을 실제 토큰과 대조한다. -->
    <script>
      var appearance = {}
      try { appearance = JSON.parse(localStorage.getItem('sasa-appearance') || '{}') || {} } catch (e) {}
      try {
        var style = ['classic', 'neumorphism', 'neo-brutalism', 'glassmorphism'].indexOf(appearance.themeStyle) >= 0 ? appearance.themeStyle : 'classic'
        var dark = appearance.theme === 'dark' || (appearance.theme !== 'light' && typeof matchMedia === 'function' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.documentElement.dataset.themeStyle = style
        var colors = { classic: ['#fffdf8', '#272e29'], neumorphism: ['#e8edf2', '#293340'], 'neo-brutalism': ['#fffef9', '#303239'], glassmorphism: ['#eaf3f8', '#101f2c'] }
        document.querySelector('meta[name=theme-color]').content = colors[style][dark ? 1 : 0]
      } catch (e) {}
    </script>

    <!-- iOS는 manifest만으로 홈 화면 설치가 제대로 되지 않는다. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- translucent 라야 화면이 상태바 밑까지 올라가 이음매가 사라진다.
         default 는 iOS 가 문서 배경색으로 별도 띠를 그려 경계가 남는다. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="할 일" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- 각 테마가 사용하는 서체만 CSS에서 요청한다. 다른 테마에서 머니그라피를 미리 받지 않는다. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
